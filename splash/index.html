<style>
  :root {
    --paper: #faf7f2;
    --ink: #14181f;
    --ink-soft: #4a5260;
    --accent: #df3884;
    --accent-deep: #982d61;
    --accent-wash: #f7e0e5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  .start {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0;
  }
  .tile {
    width: clamp(84px, 13vmin, 120px);
    height: clamp(84px, 13vmin, 120px);
    border-radius: 26%;
    background: var(--accent-wash);
    box-shadow: 0 10px 30px -14px rgba(20, 24, 31, .35), inset 0 0 0 1px rgba(20,24,31,.06);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .tile img { width: 100%; height: 100%; display: block; }
  h1 {
    margin: clamp(18px, 3.2vmin, 30px) 0 0;
    font-size: clamp(38px, 7.4vmin, 68px);
    line-height: 1.02;
    letter-spacing: -0.028em;
    font-weight: 800;
  }
  .tag {
    margin: clamp(8px, 1.4vmin, 14px) 0 0;
    font-size: clamp(16px, 2.35vmin, 23px);
    line-height: 1.35;
    color: var(--ink-soft);
    max-width: 34ch;
  }
  .chips {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 0;
    margin: clamp(16px, 2.6vmin, 24px) 0 0;
  }
  .chips li {
    font-size: clamp(12px, 1.5vmin, 14px);
    font-weight: 600;
    letter-spacing: .01em;
    padding: 7px 13px;
    border-radius: 999px;
    color: var(--accent-deep);
    background: var(--accent-wash);
  }
  .play {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: clamp(24px, 4vmin, 38px);
    padding: clamp(15px, 2.1vmin, 20px) clamp(34px, 5.4vmin, 52px);
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: clamp(18px, 2.4vmin, 24px);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-decoration: none;
    box-shadow: 0 14px 28px -14px color-mix(in srgb, var(--accent) 70%, transparent);
    transition: transform .16s ease, box-shadow .16s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .play:hover { transform: translateY(-1px); }
  .play:active { transform: translateY(0) scale(.985); }
  .play svg { width: 1em; height: 1em; }
  .note {
    margin: clamp(18px, 2.6vmin, 26px) 0 0;
    font-size: clamp(12px, 1.5vmin, 14px);
    color: var(--ink-soft);
    opacity: .8;
  }
  .note a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(74,82,96,.3); }
  @media (max-height: 460px) {
    h1 { font-size: clamp(30px, 6vmin, 44px); }
    .tag { display: none; }
    .note { display: none; }
    .play { margin-top: 20px; }
  }
</style>
