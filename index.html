<style>
  #startskarm {
    position: fixed; inset: 0; z-index: 2147483000;
    background: #faf7f2; color: #14181f;
    font-family: Inter, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    overflow: auto;
    opacity: 1; transition: opacity .22s ease;
  }
  #startskarm.dold { opacity: 0; pointer-events: none; }
  #startskarm .start {
    width: 100%; max-width: 620px; display: flex; flex-direction: column;
    align-items: center; text-align: center;
  }
  #startskarm .tile {
    width: clamp(84px, 13vmin, 120px); height: clamp(84px, 13vmin, 120px);
    border-radius: 26%; background: #f7e0e5;
    box-shadow: 0 10px 30px -14px rgba(20,24,31,.35), inset 0 0 0 1px rgba(20,24,31,.06);
    display: grid; place-items: center; overflow: hidden;
  }
  #startskarm .tile img { width: 100%; height: 100%; display: block; }
  #startskarm h1 {
    margin: clamp(18px, 3.2vmin, 30px) 0 0;
    font-size: clamp(38px, 7.4vmin, 68px); line-height: 1.02;
    letter-spacing: -0.028em; font-weight: 800; color: #14181f;
  }
  #startskarm .tag {
    margin: clamp(8px, 1.4vmin, 14px) 0 0;
    font-size: clamp(16px, 2.35vmin, 23px); line-height: 1.35;
    color: #4a5260; max-width: 34ch;
  }
  #startskarm .chips {
    list-style: none; display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px; padding: 0; margin: clamp(16px, 2.6vmin, 24px) 0 0;
  }
  #startskarm .chips li {
    font-size: clamp(12px, 1.5vmin, 14px); font-weight: 600; letter-spacing: .01em;
    padding: 7px 13px; border-radius: 999px; color: #9e2e64; background: #f7e0e5;
  }
  #startskarm .play {
    display: inline-flex; align-items: center; gap: 12px;
    margin-top: clamp(24px, 4vmin, 38px);
    padding: clamp(15px, 2.1vmin, 20px) clamp(34px, 5.4vmin, 52px);
    border: 0; border-radius: 999px; background: #df3884; color: #fff;
    font: inherit; font-size: clamp(18px, 2.4vmin, 24px); font-weight: 700;
    letter-spacing: -0.01em; cursor: pointer;
    box-shadow: 0 14px 28px -14px #df388499;
    transition: transform .16s ease; -webkit-tap-highlight-color: transparent;
  }
  #startskarm .play:hover { transform: translateY(-1px); }
  #startskarm .play:active { transform: scale(.985); }
  #startskarm .play svg { width: 1em; height: 1em; }
  #startskarm .note {
    margin: clamp(18px, 2.6vmin, 26px) 0 0;
    font-size: clamp(12px, 1.5vmin, 14px); color: #4a5260; opacity: .8;
  }
  #startskarm .note a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(74,82,96,.3); }
  @media (max-height: 470px) {
    #startskarm h1 { font-size: clamp(30px, 6vmin, 44px); }
    #startskarm .tag, #startskarm .note { display: none; }
    #startskarm .play { margin-top: 20px; }
  }
</style>
<div id="startskarm" role="dialog" aria-label="Wordris">
  <div class="start">
    <div class="tile"><img src="/icon-512.png" alt="" width="512" height="512"></div>

    <ul class="chips"><li>Ordspel</li><li>Läsning</li><li>Låg- och mellanstadiet</li></ul>
    <button class="play" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-11-6.86A1 1 0 0 0 8 5.14Z"/></svg>
      Spela
    </button>
    <p class="note">Gratis · ingen inloggning · <a href="https://www.skolappar.com">skolappar.com</a></p>
  </div>
</div>
<script>
  (function () {
    var s = document.getElementById('startskarm');
    var d = document.documentElement, b = document.body;
    var prev = [d.style.overflow, b.style.overflow];
    d.style.overflow = 'hidden'; b.style.overflow = 'hidden';
    s.querySelector('.play').addEventListener('click', function () {
      d.style.overflow = prev[0]; b.style.overflow = prev[1];
      s.classList.add('dold');
      s.setAttribute('aria-hidden', 'true');
      setTimeout(function () { s.remove(); }, 240);
      document.dispatchEvent(new CustomEvent('startskarm:spela'));
    });
  })();
</script>
